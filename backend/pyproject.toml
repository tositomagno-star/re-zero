[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cronicas-do-reino-api"
version = "0.1.0"
description = "Initial FastAPI service and data model for Crônicas do Reino"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "Pillow>=11.3,<13",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: requires the isolated local cronicas_do_reino_test PostgreSQL database",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
